name: Worker secrets

# The runtime half of section 11, and the only way to set it from here.
#
# `NEXT_PUBLIC_*` is inlined into the bundle at build time, so the deploy workflow passes it to
# the build and nothing else. The variables this workflow sets are the ones read from
# `process.env` while a request is being served - and `@opennextjs/cloudflare` copies every
# string binding on the Worker into `process.env` on the first request, which is what makes a
# `wrangler secret` visible to Next at all.
#
# Both `NEXT_PUBLIC_*` values are set here as well, even though the code that uses them has them
# inlined. `lib/env.ts` reads its list with `process.env[name]`, which Next cannot inline, so a
# variable that is only ever a build-time constant would read as missing at runtime and the
# startup check would take the site down for a variable the app does not need. Setting all four
# keeps the check able to fail for the right reason instead of the wrong one.
#
# Dispatch only. Rotating a key means running this again - `secret bulk` overwrites - and it is
# not something a push should do silently.
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse to run on a partial set
        # Half the secrets is worse than none: `secret bulk` would succeed, the Worker would hold
        # a mixture of new and stale values, and the run would go green. Same argument as the
        # deploy workflow's credential check, and the same shape.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                      SUPABASE_SERVICE_ROLE_KEY CRON_SECRET; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing"
            exit 1
          fi
          if [ ${#CRON_SECRET} -lt 32 ]; then
            echo "::error::CRON_SECRET is ${#CRON_SECRET} characters. lib/env.ts refuses anything under 32."
            exit 1
          fi
          echo "All six present, and CRON_SECRET is long enough."

      - name: Set the Worker's runtime secrets
        # Piped through stdin rather than written to a file: a JSON file of secrets on the runner
        # is one `actions/upload-artifact` away from being published, and there is no reason for
        # it to exist on disk at all.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          jq -n \
            --arg url "$NEXT_PUBLIC_SUPABASE_URL" \
            --arg anon "$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --arg service "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg cron "$CRON_SECRET" \
            '{NEXT_PUBLIC_SUPABASE_URL: $url,
              NEXT_PUBLIC_SUPABASE_ANON_KEY: $anon,
              SUPABASE_SERVICE_ROLE_KEY: $service,
              CRON_SECRET: $cron}' \
            | pnpm exec wrangler secret bulk

      - name: Show which secrets the Worker holds
        # Names only - `secret list` never prints a value. This is the evidence for card 0030's
        # second criterion, so it runs as its own step rather than being taken on trust.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler secret list
