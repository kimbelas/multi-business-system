name: Deploy

# Deploys on main, after CI has passed. This is the authoritative deploy: the adapter does
# not build reliably on Windows, so a developer machine is not a fallback for it.
#
# Needs one repository secret before it can run:
#   CLOUDFLARE_API_TOKEN  - a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - from the Workers dashboard
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Never deploy a red build. workflow_run fires whatever the outcome, so this is checked
    # rather than assumed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse to deploy without real credentials
        # CI falls back to placeholder Supabase values so the suite can run on a fork. A deploy
        # must not: NEXT_PUBLIC_* is inlined into the client bundle at build time, so a
        # placeholder here ships a Worker that looks fine and cannot reach the database. Failing
        # with a message that names the missing secret is the only useful outcome.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot deploy - these repository secrets are not set:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "All four deploy secrets are present."

      - name: Build the Worker
        # A separate step, because `opennextjs-cloudflare deploy` does NOT build first. The
        # comment that used to be on the step below said it did, and the first deploy that ever
        # got past the credential check failed with:
        #
        #   ERROR Could not find compiled Open Next config, did you run the build command?
        #
        # NEXT_PUBLIC_* belongs here rather than on the deploy: it is inlined into the client
        # bundle at build time, not read at runtime, so this is the only step where it matters.
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # SUPABASE_SERVICE_ROLE_KEY and CRON_SECRET are deliberately absent: they are read at
          # runtime and belong in `wrangler secret put`, never in a build environment.

      - name: Deploy to Cloudflare Workers
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
